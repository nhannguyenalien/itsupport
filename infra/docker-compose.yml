name: support-agent-platform

x-security: &security
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    <<: *security
    environment:
      POSTGRES_USER: support
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: support_agent
    secrets: [db_password, db_app_password]
    volumes:
      - db-data:/var/lib/postgresql/data
      - ../backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./postgres-init/02-app-role.sh:/docker-entrypoint-initdb.d/02-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support -d support_agent"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits: { memory: 1G, cpus: "1.0" }

  backend:
    build: ../backend
    <<: *security
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    environment:
      DATABASE_URL: postgresql://support_app@db:5432/support_agent
      DATABASE_ADMIN_URL: postgresql://support@db:5432/support_agent
      PGAPP_PASSWORD_FILE: /run/secrets/db_app_password
      PGADMIN_PASSWORD_FILE: /run/secrets/db_password
      PORT: "3000"
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase_admin
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:18080}
      FRONTEND_URL: ${APP_PUBLIC_URL:-http://127.0.0.1:18080}
      MESHCENTRAL_API_USER: ${MESHCENTRAL_API_USER:-}
      MESHCENTRAL_API_PASSWORD: ${MESHCENTRAL_API_PASSWORD:-}
      MESHCENTRAL_URL: ${MESHCENTRAL_URL:-}
      MESHCENTRAL_TENANT_GROUPS: ${MESHCENTRAL_TENANT_GROUPS:-}
      MESHCENTRAL_LINUX_TENANT_GROUPS: ${MESHCENTRAL_LINUX_TENANT_GROUPS:-}
      AGENT_API_URL: ${AGENT_PUBLIC_URL:-https://agent.invalid}
      AGENT_CA_CERT_PATH: /run/secrets/agent_ca_cert
      AGENT_CA_KEY_PATH: /run/secrets/agent_ca_key
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SCHOOLSAI_API_URL: ${SCHOOLSAI_API_URL:-https://apic.schoolsai.work}
      SCHOOLSAI_API_KEY: ${SCHOOLSAI_API_KEY:-}
      # Where the backend reads the published agent manifest version (in-network).
      AGENT_DOWNLOADS_URL: ${AGENT_DOWNLOADS_URL:-http://frontend:3000/downloads/agent}
      OAUTH_TOKEN_ENC_KEY: ${OAUTH_TOKEN_ENC_KEY:-}
      # Where agents download restic from for device backups (docs/backup.md).
      RESTIC_WINDOWS_URL: ${RESTIC_WINDOWS_URL:-}
      RESTIC_WINDOWS_SHA256: ${RESTIC_WINDOWS_SHA256:-}
      OAUTH_STATE_SECRET: ${OAUTH_STATE_SECRET:-}
      OAUTH_REDIRECT_BASE_URL: ${APP_PUBLIC_URL:-http://127.0.0.1:18080}/api
    secrets: [db_password, db_app_password, agent_ca_cert, agent_ca_key, firebase_admin]
    command: ["sh", "-c", "export DATABASE_URL=postgresql://support_app:$(cat $$PGAPP_PASSWORD_FILE)@db:5432/support_agent DATABASE_ADMIN_URL=postgresql://support:$(cat $$PGADMIN_PASSWORD_FILE)@db:5432/support_agent; exec node dist/index.js"]
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 8
    deploy:
      resources:
        limits: { memory: 1G, cpus: "1.0" }

  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${FIREBASE_PROJECT_ID}.firebaseapp.com
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID}
    <<: *security
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m", "/app/.next/cache:rw,noexec,nosuid,size=64m"]
    depends_on:
      backend: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: 512M, cpus: "0.5" }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    ports:
      - "127.0.0.1:${WEB_PORT:-18080}:8080"
      - "127.0.0.1:${AGENT_MTLS_PORT:-18443}:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./secrets/agent-ca.crt:/etc/caddy/agent-ca.crt:ro
      - ./secrets/agent-server.crt:/etc/caddy/agent-server.crt:ro
      - ./secrets/agent-server.key:/etc/caddy/agent-server.key:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [frontend, backend]

  backup:
    image: postgres:16-alpine
    <<: *security
    environment: { PGHOST: db, PGUSER: support, PGDATABASE: support_agent }
    secrets: [db_password]
    volumes:
      - ./backup.sh:/usr/local/bin/backup:ro
      - db-backups:/backups
    command: ["sh", "-c", "while true; do /usr/local/bin/backup; sleep 86400; done"]
    depends_on:
      db: { condition: service_healthy }

  # Optional restic repository server for device backups (docs/backup.md).
  # Off by default: `docker compose --profile backup up -d restic-rest`.
  # Append-only so a compromised client cannot delete or overwrite old snapshots;
  # pruning is done operator-side (see docs/backup.md).
  restic-rest:
    profiles: ["backup"]
    image: restic/rest-server:0.13.0
    <<: *security
    command: ["--path", "/data", "--append-only", "--private-repos", "--htpasswd-file", "/etc/restic/htpasswd", "--listen", ":8000"]
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - restic-data:/data
      - ./secrets/restic_htpasswd:/etc/restic/htpasswd:ro

secrets:
  db_password: { file: ./secrets/db_password }
  db_app_password: { file: ./secrets/db_app_password }
  agent_ca_cert: { file: ./secrets/agent-ca.crt }
  agent_ca_key: { file: ./secrets/agent-ca.key }
  firebase_admin: { file: ./secrets/firebase-admin.json }

volumes:
  db-data:
  db-backups:
  caddy-data:
  caddy-config:
  restic-data:
